<title>ERP Financeiro Pessoal</title>
<style>
:root{
  --bg:#000;--bg2:#050506;--card:#0b0c0f;--card2:#121317;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --tx:#f5f7fa;--tx2:#9aa4b2;--tx3:#6b7585;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;--purple:#bf5af2;--teal:#64d2ff;--yellow:#ffd60a;--pink:#ff375f;
  --r:22px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;z-index:0;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.1;pointer-events:none;transition:transform .2s linear}
body::before{background:var(--blue);left:-20vmax;top:-20vmax;transform:translateY(calc(var(--sy,0)*.25px))}
body::after{background:var(--purple);right:-25vmax;bottom:-20vmax;transform:translateY(calc(var(--sy,0)*-.18px))}
.wrap{position:relative;z-index:1;width:100%;padding:0 clamp(16px,2.6vw,48px) 80px}
header{position:sticky;top:0;z-index:20;margin:0 calc(-1*clamp(16px,2.6vw,48px));padding:14px clamp(16px,2.6vw,48px);background:rgba(0,0,0,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-weight:800;box-shadow:0 6px 24px rgba(10,132,255,.4)}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--tx2);font-size:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sel{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px 12px}
.sel label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
select{background:transparent;border:0;color:var(--tx);font-size:15px;font-weight:600;outline:0;cursor:pointer;color-scheme:dark}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;transition:.2s}
.btn:hover{background:var(--card2);transform:translateY(-1px)}
.pill{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.dot.ok{background:var(--green);box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2s infinite}
.dot.bad{background:var(--red)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.banner{margin:16px 0 0;padding:14px 18px;border-radius:16px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.35);color:#ffd9a0;font-size:14px;line-height:1.5}
h2.sec{font-size:clamp(20px,2vw,28px);font-weight:700;letter-spacing:-.02em;margin:44px 0 6px}
p.sub{color:var(--tx2);font-size:14px;margin-bottom:16px}
/* reveal */
.rv{opacity:0;transform:translateY(46px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.l{transform:translateX(-70px)}.rv.r{transform:translateX(70px)}
.rv.in{opacity:1;transform:none}
/* hero + chips */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
@media(max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.ht{border-radius:24px;padding:22px 26px;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.ht .lbl{color:rgba(255,255,255,.8)}.ht .num{font-size:clamp(28px,3vw,44px);margin:8px 0 0}
.ht::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.ht small{display:block;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.88)}
.ins{display:flex;flex-direction:column;gap:10px}.ins div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.5}.ins i{font-style:normal;font-size:18px;flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chp{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--tx2);transition:.2s}
.chp:hover{color:#fff;transform:translateY(-2px)}.chp.on{background:linear-gradient(135deg,#1fae4f,#0f7a45);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(48,209,88,.3)}
/* kpi strip */
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 2px 16px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;cursor:grab}
.strip.drag{cursor:grabbing;scroll-snap-type:none}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.kpi{flex:0 0 clamp(210px,17vw,270px);scroll-snap-align:start;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;position:relative;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--blue));opacity:.9}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--blue));opacity:.1;filter:blur(18px)}
.kpi:hover{transform:translateY(-5px);border-color:var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.lbl{font-size:12px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.num{display:block;font-size:clamp(22px,2vw,30px);font-weight:750;letter-spacing:-.03em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--tx2);line-height:1.4;display:block;min-height:34px}
.pbar{height:5px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--c,var(--blue));border-radius:9px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.in .pbar i,.pbar.go i{width:var(--p,0%)}
.pos{color:var(--green)}.neg{color:var(--red)}
/* grid */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.g2,.g32,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;min-width:0}
.card h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card .hs{font-size:12px;color:var(--tx2);margin:3px 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
.col rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*40ms)}
.go .col rect{transform:scaleY(1)}
.col:hover rect{filter:brightness(1.35)}
.col .hit{fill:transparent}
.line{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset 1.8s ease .3s}
.go .line{stroke-dashoffset:0}
.ax text{fill:var(--tx3);font-size:11px}
.ax line{stroke:var(--line)}
/* donut */
.dn{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center}
.dnw{position:relative;width:min(230px,100%);flex:0 0 auto}
.dnw svg circle.seg{transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1),stroke-width .2s;cursor:pointer}
.dnw svg circle.seg:hover{stroke-width:25}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 26%}
.ctr b{font-size:clamp(15px,1.4vw,20px);font-weight:750;letter-spacing:-.02em;transition:color .2s}
.ctr span{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.25}
.dl{flex:1 1 150px;display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:140px}
.dl div{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:default;transition:background .2s}
.dl div:hover{background:rgba(255,255,255,.05)}
.dl i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.dl em{min-width:0;text-align:left;font-style:normal;margin-left:auto;color:var(--tx2);font-variant-numeric:tabular-nums}
/* top lists */
.tl{display:flex;flex-direction:column;gap:9px}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);position:relative;overflow:hidden;transition:transform .25s,background .25s}
.it:hover{transform:translateX(5px);background:rgba(255,255,255,.07)}
.it .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--c,var(--blue));color:#000}
.it .d{min-width:0}.it .d b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d small{font-size:11.5px;color:var(--tx2)}
.it .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.it .v small{display:block;font-size:11px;font-weight:500;color:var(--tx2)}
.it .fill{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--c,var(--blue));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.in .it .fill,.go .it .fill{width:var(--p)}
.empty{color:var(--tx3);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
.bd{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px;vertical-align:1px}
.bd.ok{background:rgba(48,209,88,.15);color:var(--green)}.bd.pd{background:rgba(255,159,10,.15);color:var(--orange)}.bd.at{background:rgba(255,69,58,.16);color:var(--red)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:min-content;gap:6px}.cal .wd{grid-row:auto}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);text-align:center;padding:4px 0}
.cd{height:104px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:.25s;overflow:hidden;position:relative}
.cd:hover{background:rgba(255,255,255,.08);transform:translateY(-3px) scale(1.02);z-index:2}
.cd.out{opacity:.25;pointer-events:none}
.cd.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cd.sel{background:rgba(10,132,255,.16);border-color:var(--blue)}
.cd .n{font-size:12px;font-weight:700;color:var(--tx2)}
.cd.today .n{color:var(--blue)}
.ch{font-size:clamp(9.5px,.85vw,12px);font-weight:700;padding:3px 7px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*14ms)}
.ch.g{background:rgba(48,209,88,.18);color:var(--green)}.ch.r{background:rgba(255,69,58,.18);color:#ff7a72}
.chips.off{opacity:.3;pointer-events:none}select:disabled{opacity:.4}.vl text{font-size:9.5px;font-weight:700;paint-order:stroke;stroke:#0b0c0f;stroke-width:2.5px}
.tbl2{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th2,.tr2{display:grid;grid-template-columns:70px minmax(0,1fr) 110px 110px 130px;gap:10px;align-items:center;padding:9px 14px}
.th2{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);background:rgba(255,255,255,.03)}
.tr2{border-top:1px solid var(--line);font-size:12.5px}.tr2.now{background:rgba(10,132,255,.1)}
.d2 b{display:block}.d2 small{color:var(--tx3);text-transform:uppercase;font-size:10px}
.w2{display:flex;flex-direction:column;gap:2px;min-width:0}.mv2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}.mv2.g{color:#7fe3a0}.mv2.r{color:#ff9b94}.mv2.ok{opacity:.65}.mv2 b{color:var(--tx);margin-left:4px}.mv2 u{text-decoration:none;font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(255,159,10,.15);color:var(--orange);margin-left:4px}
.n2{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}.n2 small{display:block;font-size:9.5px;color:var(--tx3);font-weight:500;text-transform:uppercase}.n2.pos{color:var(--green)}.n2.neg{color:#ff7a72}
@media(max-width:800px){.th2{display:none}.tr2{grid-template-columns:56px minmax(0,1fr);}.tr2 .n2{display:none}}
.cdh{display:flex;justify-content:space-between;align-items:center;gap:4px}.net{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}.net.g{background:rgba(48,209,88,.16);color:var(--green)}.net.r{background:rgba(255,69,58,.16);color:#ff7a72}
.dls{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:0;width:100%;min-width:0;text-align:left}
.cl{width:100%;min-width:0;display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:5px;font-size:11px;line-height:1.2;color:var(--tx2)}.cl i{width:6px;height:6px;border-radius:50%;background:var(--c0)}.cl em{min-width:0;text-align:left;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl b{font-weight:600;color:var(--tx);font-size:10.5px}
.cl.g{--c0:#30d158}.cl.r{--c0:#ff453a}.cl.ok{opacity:.55}.cl.ok i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c0)}.cl.more{display:block;color:var(--tx3);font-size:10px;padding-left:11px}
.cd.late{box-shadow:inset 0 0 0 1px rgba(255,69,58,.55)}
@media(max-width:700px){.cd{height:64px;padding:5px}.dls{display:none}.net{font-size:9px;padding:1px 4px}}
.ch.hollow{background:transparent;box-shadow:inset 0 0 0 1px currentColor}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.mrow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;margin-top:16px}
@media(max-width:900px){.mrow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mb{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;transition:.25s}
.mb:hover{transform:translateY(-4px);background:rgba(255,255,255,.08)}
.mb.on{background:linear-gradient(160deg,rgba(10,132,255,.35),rgba(191,90,242,.25));border-color:var(--blue);transform:translateY(-4px)}
.mb b{display:block;font-size:12px}.mb span{display:block;font-size:10.5px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chead .t{font-size:20px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.ib{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);font-size:16px}
.ib:hover{background:var(--blue)}
#tip{position:fixed;z-index:99;pointer-events:none;background:rgba(24,30,40,.96);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:300px;backdrop-filter:blur(10px)}
#tip.on{opacity:1}
.day{max-height:260px;overflow:auto;margin-top:14px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

.btn.spin .ri{display:inline-block;animation:rot .8s linear infinite}.btn:disabled{opacity:.75;cursor:wait}
@keyframes rot{to{transform:rotate(360deg)}}
.kpi{background:radial-gradient(240px circle at var(--mx,-300px) var(--my,-300px),rgba(255,255,255,.11),transparent 65%),linear-gradient(160deg,var(--card2),var(--card))}
.card{background:radial-gradient(380px circle at var(--mx,-400px) var(--my,-400px),rgba(255,255,255,.065),transparent 65%),linear-gradient(165deg,var(--card2),var(--card))}
.ht{background:radial-gradient(300px circle at var(--mx,-400px) var(--my,-400px),rgba(255,255,255,.22),transparent 65%),linear-gradient(135deg,var(--c1),var(--c2))}
.ht::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(130%)}}
.kpi.in,.ht.in{transition:transform .18s ease-out,border-color .3s,box-shadow .3s;will-change:transform}
.it{background:radial-gradient(200px circle at var(--mx,-300px) var(--my,-300px),rgba(255,255,255,.09),transparent 70%),rgba(255,255,255,.035)}
.it.late{border-left:3px solid var(--c)}
.spk{position:absolute;right:12px;top:14px;width:42%;height:30px;pointer-events:none}
.spk path{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.8s ease .4s;vector-effect:non-scaling-stroke}
.in .spk path,.go .spk path{stroke-dashoffset:0}
.alr{border-radius:22px;padding:20px 22px;position:relative;overflow:hidden;border:1px solid var(--c);background:linear-gradient(160deg,rgba(255,255,255,.05),transparent),var(--card);animation:alp 2.4s ease-in-out infinite;transition:transform .25s}
.alr:hover{transform:translateY(-4px)}
.alr .lbl{color:var(--c)}.alr b{display:block;font-size:clamp(24px,2.4vw,34px);margin:8px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.alr small{color:var(--tx2);font-size:12.5px}
@keyframes alp{50%{box-shadow:0 0 0 7px var(--cg)}}
.alr.zero{animation:none;border-color:var(--line)}.alr.zero .lbl{color:var(--tx2)}
.ins .bad{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.45)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.qc{border-radius:22px;padding:22px;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.qc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.qc:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 20px 44px rgba(0,0,0,.5)}
.qc .q{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--c);font-weight:700}
.qc .a{margin-top:10px;font-size:14.5px;line-height:1.6;color:var(--tx2)}.qc .a b{display:block;font-size:clamp(20px,1.8vw,26px);color:#fff;letter-spacing:-.02em;margin-bottom:6px}
.c2{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.c2>div{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12.5px;color:var(--tx2);transition:transform .2s}.c2>div:hover{transform:translateY(-3px)}.c2 b{display:block;font-size:18px;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
.dh .hl{opacity:0;stroke:rgba(255,255,255,.4);stroke-dasharray:3 4;transition:opacity .15s}.dh:hover .hl{opacity:1}
.proj{stroke-dasharray:7 8;animation:flow 1s linear infinite;opacity:0;transition:opacity 1s 1.4s}.go .proj{opacity:1}
@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pls 1.7s ease-out infinite}
@keyframes pls{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.areaf{opacity:0;transition:opacity 1.4s .6s}.go .areaf{opacity:1}

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");var h=e.target.querySelectorAll(".go-host,.dnw,.dl,.tl");e.target.classList.add("go");fx(e.target);io.unobserve(e.target)}})},{threshold:.12});
function fx(root){
  root.querySelectorAll(".go-host").forEach(function(h){h.classList.add("go")});
  root.querySelectorAll(".dn").forEach(function(d){if(d.dataset.on)return;d.dataset.on=1;var C=+d.dataset.c;d.querySelectorAll("circle.seg").forEach(function(c){c.style.strokeDasharray=(c.dataset.len)+" "+C})});
  root.querySelectorAll(".num[data-v]").forEach(count)}
function count(el){var v=+el.dataset.v,f=el.dataset.f,t0=performance.now(),dur=1200;if(f==="date"){el.textContent=v?fd(new Date(v)):"—";return}
  (function step(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4),x=v*e;el.textContent=f==="pct"?x.toFixed(1).replace(".",",")+"%":brl(x);if(p<1)requestAnimationFrame(step);else{el.textContent=f==="pct"?v.toFixed(1).replace(".",",")+"%":brl(v)}
    el.style.color=(f==="brl"&&v<0)?"var(--red)":""})(t0)}
function afterRender(){
  document.querySelectorAll(".rv").forEach(function(e,i){e.style.setProperty("--d",(e.classList.contains("kpi")?(i%8)*60:0)+"ms");io.observe(e)});
  var s=document.querySelectorAll(".strip");s.forEach(function(st){var down=false,x0=0,sl=0;
    st.onmousedown=function(e){down=true;x0=e.pageX;sl=st.scrollLeft;st.classList.add("drag")};
    window.addEventListener("mouseup",function(){down=false;st.classList.remove("drag")});
    st.onmousemove=function(e){if(!down)return;e.preventDefault();st.scrollLeft=sl-(e.pageX-x0)}});
}

function banner(){

function status(){var has=rowsOf("rec")||rowsOf("des"),dt=$("#dt"),st=$("#st"),ts=Object.keys(stored).map(function(k){return stored[k]});

function onEv(k){return function(ev){

(window.claude&&window.claude.use?window.claude.use("mcp"):Promise.resolve(null)).then(function(m){
